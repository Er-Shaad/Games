<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Game</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #1e1e1e, #333);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }
    h1 {
      margin: 20px;
      text-shadow: 2px 2px 4px #000;
    }
    .controls {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    select, button, a {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      background-color: #00aaff;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0088cc;
    }
    a {
      color: #00ffff;
      text-decoration: none;
    }
    #game-board {
      display: grid;
      gap: 4px;
      background-color: #ffffff;
      padding: 5px;
      border-radius: 10px;
      transition: all 0.3s ease-in-out;
    }
    .cell {
      width: 60px;
      height: 60px;
      background-color: #000;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .player1 {
      color: red;
    }
    .player2 {
      color: limegreen;
    }
    #status {
      margin-top: 20px;
      font-size: 1.4em;
    }
    .winner-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5em;
      font-weight: bold;
      color: gold;
      display: none;
      z-index: 9999;
      text-shadow: 2px 2px 10px #000;
    }
    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      background: yellow;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }
    @keyframes explode {
      to {
        transform: translate(var(--dx), var(--dy));
        opacity: 0;
      }
    }
    @media (max-width: 600px) {
      .cell {
        width: 40px;
        height: 40px;
        font-size: 1.5em;
      }
      #game-board {
        padding: 2px;
        gap: 2px;
      }
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="controls">
    <label for="size">Choose Board Size: </label>
    <select id="size">
      <option value="3">3 x 3</option>
      <option value="4">4 x 4</option>
      <option value="5">5 x 5</option>
    </select>
    <button onclick="startGame()">Start Game</button>
    <a href="memory.html">🎲 Go to Ludo/Snake Game</a>
  </div>
  <div id="game-board"></div>
  <div id="status"></div>
  <div id="winnerBanner" class="winner-banner"></div>

  <script>
    let boardSize = 3;
    let board = [];
    let currentPlayer = 'X';
    let gameOver = false;

    function startGame() {
      boardSize = parseInt(document.getElementById("size").value);
      board = Array(boardSize * boardSize).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      document.getElementById("status").textContent = "";
      document.getElementById("winnerBanner").style.display = "none";

      const boardEl = document.getElementById("game-board");
      boardEl.innerHTML = "";
      boardEl.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      boardEl.style.width = `${boardSize * 62}px`;

      for (let i = 0; i < board.length; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", handleCellClick);
        boardEl.appendChild(cell);
      }
    }

    function handleCellClick(e) {
      const index = e.target.dataset.index;
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add(currentPlayer === 'X' ? 'player1' : 'player2');

      if (checkWin()) {
        const winnerText = `🎉 Player ${currentPlayer === 'X' ? '1' : '2'} wins!`;
        document.getElementById("status").textContent = winnerText;
        showBanner(winnerText);
        launchFireworks();
        gameOver = true;
        return;
      }

      if (board.every(cell => cell)) {
        document.getElementById("status").textContent = "It's a draw!";
        gameOver = true;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    }

    function checkWin() {
      const lines = [];
      for (let r = 0; r < boardSize; r++) {
        const row = [];
        for (let c = 0; c < boardSize; c++) {
          row.push(r * boardSize + c);
        }
        lines.push(row);
      }
      for (let c = 0; c < boardSize; c++) {
        const col = [];
        for (let r = 0; r < boardSize; r++) {
          col.push(r * boardSize + c);
        }
        lines.push(col);
      }
      const diag1 = [], diag2 = [];
      for (let i = 0; i < boardSize; i++) {
        diag1.push(i * boardSize + i);
        diag2.push(i * boardSize + (boardSize - 1 - i));
      }
      lines.push(diag1);
      lines.push(diag2);

      return lines.some(line =>
        line.every(index => board[index] === currentPlayer)
      );
    }

    function showBanner(text) {
      const banner = document.getElementById("winnerBanner");
      banner.textContent = text;
      banner.style.display = "block";
    }

    function launchFireworks() {
      for (let i = 0; i < 50; i++) {
        const dot = document.createElement("div");
        dot.className = "firework";
        dot.style.left = `${window.innerWidth / 2}px`;
        dot.style.top = `${window.innerHeight / 2}px`;
        dot.style.setProperty('--dx', `${Math.random() * 400 - 200}px`);
        dot.style.setProperty('--dy', `${Math.random() * 400 - 200}px`);
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 1000);
      }
    }

    startGame();
  </script>
</body>
</html>
