<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #000428, #004e92);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }
    h1 {
      margin-top: 20px;
      text-shadow: 0 0 10px #fff;
    }
    .controls {
      margin: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    select, button, a {
      padding: 10px 15px;
      font-size: 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button {
      background: #00ffee;
      color: #000;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background: #00ccbb;
    }
    a {
      color: #0ff;
      text-decoration: none;
      font-weight: bold;
    }
    #game-board {
      display: grid;
      gap: 4px;
      background: #222;
      padding: 5px;
      border-radius: 12px;
      box-shadow: 0 0 20px #00ffee;
      position: relative;
    }
    .cell {
      width: 70px;
      height: 70px;
      background: #111;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px currentColor;
      transition: background 0.3s;
    }
    .cell:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .player1 { color: #ff073a; text-shadow: 0 0 8px #ff073a; }
    .player2 { color: #00ff00; text-shadow: 0 0 8px #00ff00; }
    #status {
      margin-top: 20px;
      font-size: 1.3em;
    }
    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      background: yellow;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }
    .win-line {
      position: absolute;
      height: 4px;
      background: #00f0ff;
      box-shadow: 0 0 12px #00f0ff;
      transform-origin: left;
      z-index: 1;
    }
    @keyframes explode {
      to {
        transform: translate(var(--dx), var(--dy));
        opacity: 0;
      }
    }
    @media (max-width: 600px) {
      .cell {
        width: 50px;
        height: 50px;
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="controls">
    <label for="size">Choose Board Size:</label>
    <select id="size" onchange="toggleStart()">
      <option value="3">3 x 3</option>
      <option value="4">4 x 4</option>
      <option value="5">5 x 5</option>
    </select>
    <button id="startButton" onclick="startGame()">Start Game</button>
    <button id="restartButton" style="display:none;" onclick="startGame()">Restart Game</button>
    <a href="memory.html">🎲 Go to Ludo/Snake Game</a>
  </div>
  <div id="game-board"></div>
  <div id="status"></div>

  <script>
    let boardSize = 3;
    let board = [];
    let currentPlayer = 'X';
    let gameOver = false;

    function toggleStart() {
      document.getElementById("startButton").style.display = "inline-block";
    }

    function startGame() {
      boardSize = parseInt(document.getElementById("size").value);
      board = Array(boardSize * boardSize).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      document.getElementById("status").textContent = "";

      const boardEl = document.getElementById("game-board");
      boardEl.innerHTML = "";
      boardEl.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      boardEl.style.width = `${boardSize * 72}px`;

      for (let i = 0; i < board.length; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", handleCellClick);
        boardEl.appendChild(cell);
      }

      // Toggle buttons
      document.getElementById("startButton").style.display = "none";
      document.getElementById("restartButton").style.display = "none";
    }

    function handleCellClick(e) {
      const index = e.target.dataset.index;
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;
      e.target.classList.add(currentPlayer === 'X' ? 'player1' : 'player2');

      const winLine = checkWin();
      if (winLine) {
        document.getElementById("status").textContent = `🎉 Player ${currentPlayer === 'X' ? '1' : '2'} wins!`;
        drawWinLine(winLine);
        launchFireworks();
        gameOver = true;
        document.getElementById("restartButton").style.display = "inline-block";
        return;
      }

      if (board.every(cell => cell)) {
        document.getElementById("status").textContent = "It's a draw!";
        gameOver = true;
        document.getElementById("restartButton").style.display = "inline-block";
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    }

    function checkWin() {
      const lines = [];

      for (let r = 0; r < boardSize; r++) {
        const row = [];
        for (let c = 0; c < boardSize; c++) {
          row.push(r * boardSize + c);
        }
        lines.push(row);
      }

      for (let c = 0; c < boardSize; c++) {
        const col = [];
        for (let r = 0; r < boardSize; r++) {
          col.push(r * boardSize + c);
        }
        lines.push(col);
      }

      const diag1 = [], diag2 = [];
      for (let i = 0; i < boardSize; i++) {
        diag1.push(i * boardSize + i);
        diag2.push(i * boardSize + (boardSize - 1 - i));
      }
      lines.push(diag1, diag2);

      for (let line of lines) {
        if (line.every(index => board[index] === currentPlayer)) {
          return line;
        }
      }
      return null;
    }

    function drawWinLine(indices) {
      const boardEl = document.getElementById("game-board");
      const first = document.querySelector(`.cell[data-index='${indices[0]}']`).getBoundingClientRect();
      const last = document.querySelector(`.cell[data-index='${indices[indices.length - 1]}']`).getBoundingClientRect();
      const boardRect = boardEl.getBoundingClientRect();

      const x1 = first.left - boardRect.left + first.width / 2;
      const y1 = first.top - boardRect.top + first.height / 2;
      const x2 = last.left - boardRect.left + last.width / 2;
      const y2 = last.top - boardRect.top + last.height / 2;

      const length = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

      const line = document.createElement("div");
      line.className = "win-line";
      line.style.left = `${x1}px`;
      line.style.top = `${y1}px`;
      line.style.width = `${length}px`;
      line.style.transform = `rotate(${angle}deg)`;

      boardEl.appendChild(line);
    }

    function launchFireworks() {
      for (let i = 0; i < 40; i++) {
        const dot = document.createElement("div");
        dot.className = "firework";
        dot.style.left = `${window.innerWidth / 2}px`;
        dot.style.top = `${window.innerHeight / 2}px`;
        dot.style.setProperty('--dx', `${Math.random() * 400 - 200}px`);
        dot.style.setProperty('--dy', `${Math.random() * 400 - 200}px`);
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 1000);
      }
    }
  </script>
</body>
</html>
